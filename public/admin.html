<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maa Astrology Admin</title><style>body{margin:0;background:#09090c;color:#f5efe0;font-family:Arial,sans-serif}.wrap{width:min(1150px,calc(100% - 24px));margin:24px auto}.login,.panel{background:#121116;border:1px solid #3a3030;border-radius:18px;padding:24px;box-shadow:0 20px 60px #0005}.login{max-width:400px;margin:80px auto}.brand{color:#f0d58b;letter-spacing:.12em;font:18px Georgia}.field{margin:12px 0}.field label{display:block;font-size:11px;color:#aaa;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border-radius:9px;border:1px solid #3a3030;background:#1a181f;color:#fff;box-sizing:border-box}.btn{padding:12px 16px;border-radius:999px;border:1px solid #d6b66a;background:linear-gradient(110deg,#f0d58b,#a8894c);font-weight:700;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{padding:18px;border:1px solid #302a27;border-radius:14px;background:#111116}.stat b{display:block;font-size:25px;color:#f0d58b;margin-top:6px}.tabs{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap}.tab{background:#19171d;color:#ddd;border:1px solid #3a3030;border-radius:9px;padding:10px 13px;cursor:pointer}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #272329;font-size:12px}.muted{color:#999}.hidden{display:none}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.table{font-size:10px}.panel{overflow:auto}}</style>

<body><div class="wrap"><div id="login" class="login"><div class="brand">MAA ASTROLOGY</div><h2>Admin Dashboard</h2><div class="field"><label>Admin password</label><input id="pass" type="password"></div><button class="btn" onclick="login()">Sign in</button><p id="err" class="muted"></p></div><div id="app" class="hidden"><div style="display:flex;justify-content:space-between;align-items:center"><div class="brand">MAA ASTROLOGY · ADMIN</div><button class="tab" onclick="logout()">Log out</button></div><div class="stats"><div class="stat">Orders<b id="orders">0</b></div><div class="stat">Paid revenue<b id="revenue">₹0</b></div><div class="stat">Products<b id="products">10</b></div><div class="stat">Pending<b id="pending">0</b></div></div><div class="panel"><div class="tabs"><button class="tab" onclick="loadOrders()">Orders</button><button class="tab" onclick="loadProducts()">Products</button></div><div id="content"></div></div></div></div><script>let token='';const $=id=>document.getElementById(id),money=n=>'₹'+Number(n||0).toLocaleString('en-IN');async function login(){const p=$('pass').value;const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});const d=await r.json();if(!r.ok){$('err').textContent=d.error||'Login failed';return}token=d.token;sessionStorage.setItem('maa_admin',token);show();loadOrders()}function show(){$('login').classList.add('hidden');$('app').classList.remove('hidden')}function logout(){sessionStorage.removeItem('maa_admin');location.reload()}async function api(url,opts={}){opts.headers={...(opts.headers||{}),Authorization:'Bearer '+token};const r=await fetch(url,opts);if(r.status===401){logout();return}return r.json()}async function loadOrders(){const d=await api('/api/admin/orders');$('orders').textContent=d.orders.length;$('revenue').textContent=money(d.orders.filter(o=>o.payment==='online').reduce((s,o)=>s+Number(o.amount||0),0));$('pending').textContent=d.orders.filter(o=>!['DELIVERED','CANCELLED'].includes(o.status)).length;$('content').innerHTML='<h3>Orders</h3><table class="table"><tr><th>ID</th><th>Customer</th><th>Items</th><th>Amount</th><th>Payment</th><th>Status</th><th></th></tr>'+d.orders.map(o=>`<tr><td>${o.id}</td><td>${o.customerName||''}<br><span class="muted">${o.mobile||''}</span></td><td>${o.items?.map(i=>`${i.id} × ${i.qty}`).join('<br>')||''}</td><td>${money(o.amount)}</td><td>${o.payment}</td><td><select onchange="status('${o.id}',this.value)">${['NEW','PAID','PROCESSING','SHIPPED','DELIVERED','CANCELLED'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="tab" onclick="view('${o.id}')">View</button></td></tr>`).join('')+'</table>'}async function status(id,s){await api('/api/admin/orders/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s})});loadOrders()}async function view(id){const d=await api('/api/admin/orders/'+encodeURIComponent(id));alert(JSON.stringify(d.order,null,2))}async function loadProducts(){const d=await fetch('./data/products.json').then(r=>r.json());$('content').innerHTML='<h3>Products</h3><p class="muted">All products are ₹399. Stock can be adjusted here; image upload/edit is reserved for the Cloudflare D1/R2 admin phase.</p><table class="table"><tr><th>Product</th><th>Price</th><th>Images</th><th>Stock</th><th>Save</th></tr>'+d.map(p=>`<tr><td>${p.name}</td><td>${money(p.price)}</td><td>${p.images.length}</td><td><input id="stock-${p.id}" value="${p.stock||0}" style="width:70px;background:#19171d;color:#fff;border:1px solid #3a3030;padding:7px;border-radius:7px"></td><td><button class="tab" onclick="saveStock('${p.id}')">Save</button></td></tr>`).join('')+'</table>'}async function saveStock(id){const stock=Number(document.getElementById('stock-'+id).value);await api('/api/admin/products/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({stock})});loadProducts()}token=sessionStorage.getItem('maa_admin');if(token){show();loadOrders()}</script></body></html>
